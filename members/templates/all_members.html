{% extends "master.html" %}

{% block title %}
 - List of all members
 {% endblock title %}

{% block content %}

<div class="card mt-2">
    <div class="card-header">
        Members
    </div>

    <div class="card-body">

        <ul class="list-group">
            {% for x in mymembers %}
            <li class="list-group-item">
                <a href="details/{{x.id}}">{{x.firstname}} {{x.lastname}}</a>
                <a href="delete/{{x.id}}" class="btn btn-danger"><i class='fa-solid fa-trash-can'></i></a>
                <a href="update/{{x.id}}" class="btn btn-info"><i class='fa-solid fa-pen'></i></a>
            </li>
            {% endfor %}
        </ul>

        <p class="mt-3">
            <a href="add/">Add member</a>
        </p>

    </div>

</div>

{% endblock %}
